# ============================================================
# Model
# ============================================================
model:
  name: yolo26n
  pretrained: true

  # concat / add / weighted
  fusion: concat

  # nearest / bilinear
  align_mode: bilinear
# ============================================================
# Dataset
# ============================================================
data:
  rgb: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy/configs/datasets/UAV-CB-RGB.yaml

  tir: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy/configs/datasets/UAV-CB-TIR.yaml

  # 第一组 baseline 先保持一致
  rgb_imgsz: 640
  tir_imgsz: 640

  # 如果你的 Dataset 测试是 stem，就改成 stem
  pair_mode: relative
# ============================================================
# Training
# ============================================================
train:
  epochs: 1
  batch: 4
  workers: 4
  device: 5
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  amp: true
  seed: 0
  deterministic: true
  grad_clip: 10.0
  # 不断点续训
  resume: null
# /mnt/sda/taochangyong/Projects/Model/YOLO-tcy/runs/rgbt/yolo26n_LRDDv3_rgbt_concat_640_seed0/weights/last.pt

# ============================================================
# Augmentation
# ============================================================
augment:
  fliplr: 0.5

  flipud: 0.0
# ============================================================
# YOLO Detection Loss
# ============================================================
loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5
# ============================================================
# Output
# ============================================================
output:
  project: runs/rgbt
  name: yolo26n_LRDDv3_rgbt_concat_640_seed0
