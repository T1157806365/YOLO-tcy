# ============================================================
# UAV-CB: isolated RGB-T + RSD-T v1
# First use this as a 1-epoch smoke test.
# After it runs correctly, change epochs to 300.
# ============================================================
traincc:
  conda activate tcy
  cd /mnt/sda/taochangyong/Projects/Model/YOLO-tcy
  mkdir -p logs
  nohup python -u train_rsdt.py \
    --cfg configs/experiments/uavcb_rsdt_yolo26n_1280_640.yaml \
    > logs/rsdt_uavcb_1280_640.log 2>&1 &
  echo $!
  tail -f logs/rsdt_uavcb_1280_640.log

  python val_rsdt.py \
    --weights runs/rsdt/yolo26n_UAVCB_rsdt_v1_rgb1280_sem640_tir640_seed0/weights/best.pt \
    --split test \
    --rgb /mnt/sda/taochangyong/Projects/Model/YOLO-tcy/configs/datasets/UAV-CB-RGB.yaml \
    --tir /mnt/sda/taochangyong/Projects/Model/YOLO-tcy/configs/datasets/UAV-CB-TIR.yaml \
    --rgb-imgsz 1280 \
    --rgb-semantic-imgsz 640 \
    --tir-imgsz 640 \
    --batch 8\
    --device 5 \
    --plots \
    --preview-num 6

model:
  name: yolo26n
  pretrained: true

  # Original RGB-T fusion is unchanged.
  # concat / add / weighted
  fusion: concat

  align_mode: bilinear

  # ----------------------------------------------------------
  # RSD-T v1
  # ----------------------------------------------------------
  use_guidance: true

  detail_channels: 64
  stem_channels: 24
  guide_channels: 32


data:
  rgb: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy/configs/datasets/UAV-CB-RGB.yaml

  tir: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy/configs/datasets/UAV-CB-TIR.yaml

  # Full-resolution image used by the shallow RSD-T detail branch.
  rgb_imgsz: 1280

  # Alias supported by train_rsdt.py, but keep rgb_imgsz as the primary key.
  # rgb_high_imgsz: 1280

  # Full RGB YOLO backbone input.
  rgb_semantic_imgsz: 640

  # Full TIR YOLO backbone input.
  tir_imgsz: 640

  pair_mode: relative


# ============================================================
# Training
# ============================================================

train:
  # ----------------------------------------------------------
  # Stage 1
  # ----------------------------------------------------------
  epochs: 300

  batch: 24
  workers: 4
  device: 5

  optimizer: SGD

  lr0: 0.01
  lrf: 0.01

  momentum: 0.937
  weight_decay: 0.0005

  amp: true

  seed: 0
  deterministic: true

  grad_clip: 10.0

  # best.pt and early stopping are based on validation mAP50-95.
  patience: 50
  early_stop_min_delta: 0.000001

  # Resume from a custom RSD-T last.pt if needed.
  resume: null

  # ----------------------------------------------------------
  # Stage 2
  #
  # Starts from Stage-1 best checkpoint.
  # Optimizer / scheduler / scaler are rebuilt.
  # ----------------------------------------------------------
  stage2:
    enabled: true

    epochs: 200

    # default strategy: 10x smaller initial LR
    lr0: 0.001
    lrf: 0.01

    patience: 50
    early_stop_min_delta: 0.000001

    # Optional overrides:
    # optimizer: SGD
    # momentum: 0.937
    # weight_decay: 0.0005


# ============================================================
# Augmentation
# ============================================================

augment:
  fliplr: 0.5
  flipud: 0.0


# ============================================================
# YOLO detection loss
# ============================================================

loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5


# ============================================================
# Output
# ============================================================

output:
  # Keep completely separate from the old RGB-T experiments.
  project: runs/rsdt

  name: yolo26n_UAVCB_rsdt_v1_rgb1280_sem640_tir640_seed0